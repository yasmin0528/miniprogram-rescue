spring:
  application:
    name: rescue-api
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rescue?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    password:
    timeout: 6000
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.tongyi.rescue_api: DEBUG

# 腾讯地图配置
tencent:
  map:
    key: ${TENCENT_MAP_KEY:}

# 阿里云 OSS 配置
aliyun:
  oss:
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucketName: ${ALIYUN_OSS_BUCKET_NAME:zhichonggang}
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
  voice:
    accessKeyId: ${ALIYUN_VOICE_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIYUN_VOICE_ACCESS_KEY_SECRET:}
    ttsCode: ${ALIYUN_VOICE_TTS_CODE:TTS_328715209}
    calledShowNumber: ${ALIYUN_VOICE_CALLED_NUMBER:}
    playTimes: ${ALIYUN_VOICE_PLAY_TIMES:3}
    connectTimeout: 5000
    readTimeout: 10000
    maxAttempts: 3

# 微信小程序多端配置
wechat:
  miniapp:
    configs:
      user:
        appid: ${WECHAT_USER_APPID:}
        secret: ${WECHAT_USER_SECRET:}
        code2session-url: https://api.weixin.qq.com/sns/jscode2session
      shifu:
        appid: ${WECHAT_SHIFU_APPID:}
        secret: ${WECHAT_SHIFU_SECRET:}
        code2session-url: https://api.weixin.qq.com/sns/jscode2session

pay:
  wechat:
    app-id:
      user: wx8ca570d5497608a7
      shifu: wxd04df113070f65d9

order:
  pay-timeout-minutes: 30
